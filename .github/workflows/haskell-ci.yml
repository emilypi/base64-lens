name: ci
on:
  push:
    branches: [master]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ghc: ['9.6.7', '9.8.4', '9.10.3', '9.12.4', '9.14.1']
        base64-flag: ['-simd']
        include:
          - os: ubuntu-latest
            ghc: '9.14.1'
            base64-flag: '+simd'
          - os: macos-latest
            ghc: '9.14.1'
            base64-flag: '-simd'
          - os: macos-latest
            ghc: '9.14.1'
            base64-flag: '+simd'
    steps:
      - uses: actions/checkout@v7
      - uses: haskell-actions/setup@v2.12.1
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: latest
      - run: cabal update
      - uses: actions/cache@v6
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.base64-flag }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}-${{ hashFiles('**/*.cabal', 'cabal.project') }}
      - name: Build source distribution
        run: |
          cabal check
          cabal sdist --output-directory="$RUNNER_TEMP/base64-lens-sdist"
          tar -xzf "$RUNNER_TEMP"/base64-lens-sdist/base64-lens-*.tar.gz -C "$RUNNER_TEMP/base64-lens-sdist"
      - name: Test and document source distribution
        run: |
          cd "$RUNNER_TEMP"/base64-lens-sdist/base64-lens-*/
          cabal test --constraint='base64 ${{ matrix.base64-flag }}' --test-show-details=direct
          cabal haddock --constraint='base64 ${{ matrix.base64-flag }}'
          cabal check
